<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
        scroll-behavior: smooth;
    }

    #nav {
        width: 100%;
        height: 60px;
        background-color: rgb(15, 15, 148);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 15px;
        color: #FFF;
        position: sticky;
        top: 0;
    }

    ul {
        display: flex;
    }

    ul li {
        display: flex;
        margin: 20px;
    }

    a {
        text-decoration: none;
        color: #fff;
    }

    .mode button {
        width: 90px;
        height: 40px;
        border-radius: 15px;
        border: none;
        color: black;
        background-color: yellow;
        font-size: 15px;
    }

    .box1 {
        width: 100%;
        display: flex;
        justify-content: center;
        background-color: rgb(240, 218, 188);

    }

    .box {
        width: 450px;
        border: 1px solid black;
        background-color: #FFF;
        border-radius: 10px;
        margin-top: 50px;
        text-align: center;
        padding: 10px 30px;
    }

    .img {
        display: flex;
        justify-content: center;
        height: 300px;
        padding-top: 20px;
    }

    .img img {
        width: 250px;
        height: 250px;
        border-radius: 50%;
    }

    .buttn {
        display: flex;
        justify-content: space-around;
        padding: 30px 5px;
    }

    .buttn button {
        border-radius: 10px;
        font-size: 18px;
        width: 100px;
        height: 45px;
        border: none;
        color: #fff;

    }
</style>

<body id="aaa">
    <div class="main-co" id="main">
        <div id="nav">
            <h1><span>Wab</span> <span>Developer</span></h1>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact</a></li>
            </ul>
            <div class="mode"><button onclick="Mode()">Mode</button></div>
        </div>

    </div>


    <script>
        // let a = "black"
        // function mode(){
        //     if(a == "black"){
        //         document.querySelector("mode").
        //     }
        // }

        let newdiv = document.createElement("div");
        newdiv.setAttribute("class", "box1");
        newdiv.innerHTML = ` <div class="box">
                <div class="img">
                    <img src="saini.jpeg" alt="">
                </div>
                <h1 style="padding: 10px;">Ashish Saini</h1>
                <hr style="width: 90px; margin: auto; ">
                    <h2 style="color: rgb(0, 162, 255); padding: 20px;">Frontend Student</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officia natus voluptas reiciendis,
                ygdghghgdghhhgfhfhfghhf</p>
                    <div class="buttn">
                        <button style="background-color: rgb(17, 193, 17);">Follow</button>
                        <button style="background-color: rgb(37, 83, 252);">Message</button>
                        <button style="background-color: darkorange;">Share</button>
                    </div>
            </div>`

        console.log(newdiv)
        let b = document.getElementById("main")
        b.appendChild(newdiv)


        let mod = "light";

        function Mode() {
            let a = document.querySelector(".box1");
            // let s = document.querySelector("aaa")
            let c = document.querySelector(".mode button");

            if (mod === "light") {
                a.style.backgroundColor = "black";
                c.innerText = "Light";
                mod = "dark";
            } else {
                a.style.backgroundColor = "rgb(240, 218, 188)";
                c.innerText = "Dark";
                mod = "light";
            }
        }
    </script>
</body>

</html>
